<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Special Ed Hub</title>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
</head>

<body style="margin:0;">
<div id="root"></div>

<script>
const { useState, useEffect } = React;

function App() {
  const [data, setData] = useState([]);
  const [search, setSearch] = useState("");
  const [announcement, setAnnouncement] = useState("");

  const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTypzAOjtcZhAkEtdPvP11wlC01FS0AvIT40CfYBmNCMk7GvWEagoCtltqCjAedq49ycAfuDi8ZrF5P/pub?output=csv";

  useEffect(() => {
    fetch(SHEET_URL)
      .then(response => response.text())
      .then(text => {
        const rows = text.split("\n").slice(1);

        const parsed = rows.map(row => {
          const cols = row.split(",");

          return {
            category: (cols[0] || "").trim(),
            name: (cols[1] || "").trim(),
            url: (cols[2] || "").trim()
          };
        }).filter(item => item.name);

        const announcementRow = parsed.find(
          item => item.category === "Announcement"
        );

        if (announcementRow) {
          setAnnouncement(announcementRow.name);
        }

        setData(
          parsed.filter(
            item => item.category !== "Announcement"
          )
        );
      });
  }, []);

  const categories = [...new Set(data.map(d => d.category))];

  const colors = {
    "IEP Resources": "#dcfce7",
    "Forms": "#fef9c3",
    "Compliance": "#d1fae5",
    "Student Support": "#fee2e2",
    "Assessments": "#dbeafe",
    "Staff Resources": "#ecfccb"
  };

  return React.createElement(
    "div",
    {
      style: {
        background: "#f3f4f6",
        minHeight: "100vh",
        fontFamily: "Arial"
      }
    },

    React.createElement(
      "div",
      {
        style: {
          background: "#166534",
          color: "white",
          padding: "16px 20px",
          display: "flex",
          justifyContent: "space-between",
          alignItems: "center",
          boxShadow: "0 2px 4px rgba(0,0,0,0.2)"
        }
      },

      React.createElement(
        "div",
        null,

        React.createElement(
          "h1",
          {
            style: {
              margin: 0,
              fontSize: "22px"
            }
          },
          "Special Ed Hub"
        ),

        React.createElement(
          "div",
          {
            style: {
              fontSize: "13px",
              opacity: 0.9
            }
          },
          "Special Education Department Resource Portal"
        )
      ),

      React.createElement(
        "div",
        {
          style: {
            fontSize: "13px",
            opacity: 0.85
          }
        },
        "TMMS"
      )
    ),

    React.createElement(
      "div",
      {
        style: {
          padding: "20px"
        }
      },

      announcement &&
        React.createElement(
          "div",
          {
            style: {
              background: "#15803d",
              color: "white",
              padding: "12px",
              marginBottom: "20px",
              borderRadius: "8px",
              fontWeight: "bold"
            }
          },
          "📢 " + announcement
        ),

      React.createElement(
        "input",
        {
