<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Special Ed Hub</title>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
</head>

<body style="margin:0;">
<div id="root"></div>

<script>
const { useState, useEffect } = React;

function App() {
  const [data, setData] = useState([]);
  const [announcement, setAnnouncement] = useState("");

  const SHEET_URL =
    "https://docs.google.com/spreadsheets/d/e/2PACX-1vTypzAOjtcZhAkEtdPvP11wlC01FS0AvIT40CfYBmNCMk7GvWEagoCtltqCjAedq49ycAfuDi8ZrF5P/pub?output=csv";

  useEffect(() => {
    fetch(SHEET_URL)
      .then(response => response.text())
      .then(text => {
        const rows = text.trim().split("\n").slice(1);

        const parsed = rows.map(row => {
          const cols = row.split(",");
          return {
            category: cols[0] ? cols[0].replace(/"/g, "").trim() : "",
            name: cols[1] ? cols[1].replace(/"/g, "").trim() : "",
            url: cols[2] ? cols[2].replace(/"/g, "").trim() : ""
          };
        });

        const announcementRow = parsed.find(
          r => r.category === "Announcement"
        );

        if (announcementRow) {
          setAnnouncement(announcementRow.name);
        }

        setData(
          parsed.filter(r => r.category !== "Announcement")
        );
      })
      .catch(error => {
        console.log(error);
      });
  }, []);

  return React.createElement(
    "div",
    {
      style: {
        fontFamily: "Arial",
        background: "#f3f4f6",
        minHeight: "100vh"
      }
    },

    React.createElement(
      "div",
      {
        style: {
          background: "#166534",
          color: "white",
          padding: "20px"
        }
      },
      React.createElement("h1", {
        style: { margin: 0 }
      }, "Special Ed Hub")
    ),
